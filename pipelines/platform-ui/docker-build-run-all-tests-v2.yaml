#
# README
# This pipeline definition contains custom tasks which are identified as such near the end of this file.
# This is v2 of the pipeline with flexible secret management using envFrom.
#
apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: docker-build-v2
  labels:
    build.appstudio.redhat.com/pipeline: docker-build-v2
spec:
  description: |
    This pipeline is ideal for building container images from a Containerfile while reducing network traffic.

    _Uses `buildah` to create a container image. It also optionally creates a source image and runs some build-time tests. EC will flag a violation for [`trusted_task.trusted`](https://enterprisecontract.dev/docs/ec-policies/release_policy.html#trusted_task__trusted) if any tasks are added to the pipeline.
    This pipeline is pushed as a Tekton bundle to [quay.io](https://quay.io/repository/konflux-ci/tekton-catalog/pipeline-docker-build?tab=tags)_
  params:
  - description: Source Repository URL
    name: git-url
    type: string
  - default: ""
    description: Revision of the Source Repository
    name: revision
    type: string
  - description: Fully Qualified Output Image
    name: output-image
    type: string
  - default: .
    description: Path to the source code of an application's component from where to build image.
    name: path-context
    type: string
  - default: Dockerfile
    description: Path to the Dockerfile inside the context specified by parameter path-context
    name: dockerfile
    type: string
  - default: "false"
    description: Force rebuild image
    name: rebuild
    type: string
  - default: "false"
    description: Skip checks against built image
    name: skip-checks
    type: string
  - default: "false"
    description: Execute the build with network isolation
    name: hermetic
    type: string
  - default: ""
    description: Build dependencies to be prefetched by Cachi2
    name: prefetch-input
    type: string
  - default: ""
    description: Image tag expiration time, time values could be something like 1h, 2d, 3w for hours, days, and weeks, respectively.
    name: image-expires-after
  - default: "true"
    description: Build a source image.
    name: build-source-image
    type: string
  - default: "false"
    description: Add built image into an OCI image index
    name: build-image-index
    type: string
  - default: []
    description: Array of --build-arg values ("arg=value" strings) for buildah
    name: build-args
    type: array
  - default: ""
    description: Path to a file with build arguments for buildah, see https://www.mankier.com/1/buildah-build#--build-arg-file
    name: build-args-file
    type: string
  - default: ""
    description: Target stage in Dockerfile to build. Empty preserves the Dockerfile default. Consumers select deploy, artifact, or another supported target explicitly.
    name: target-stage
    type: string
  - default: []
    description: Array of image labels to be applied to resulting image
    name: labels
    type: array
  - default: []
    description: Array of image annotations to be applied to resulting image
    name: annotations
    type: array
    # Custom param (not generated by Konflux)
  - description: Script run before unit tests to set up workspace (e.g., npm install)
    name: workspace-setup-script
    type: string
    default: ""
  - description: Script run while executing the run-unit-tests custom task
    name: unit-tests-script
    type: string
  - description: Image to use for running unit tests
    name: unit-test-image
    type: string
    default: "registry.access.redhat.com/ubi9/nodejs-22:latest"
    # Custom params for e2e testing (not generated by Konflux)
  - description: Script run while executing the run-e2e-tests custom task
    name: e2e-tests-script
    type: string
  - description: >-
      Deprecated. This value is no longer executed. Set run-app-command and
      run-app-args instead; shell scripts can be invoked explicitly with
      run-app-command: /bin/bash and run-app-args: ["-c", "<script>"].
    name: run-app-script
    type: string
    default: ""
  - description: Executable to run in the application sidecar
    name: run-app-command
    type: string
  - default: []
    description: Array of arguments passed to run-app-command
    name: run-app-args
    type: array
  - description: Name of ConfigMap containing proxy routes data
    name: frontend-proxy-routes-configmap
    type: string
    default: ""
  - description: Application port (default 8000)
    name: e2e-app-port
    type: string
    default: "8000"
  - description: Playwright image to use for testing
    name: e2e-playwright-image
    type: string
    default: "mcr.microsoft.com/playwright:v1.59.0-noble@sha256:11707c5282fec52f0705aad3a23f46b3409b3de4aed378b3dbe118d8b8c87b67"
  - description: Frontend proxy image
    name: e2e-proxy-image
    type: string
    default: "quay.io/redhat-user-workloads/hcc-platex-services-tenant/frontend-development-proxy:latest"
  - name: buildah-format
    default: docker
    type: string
    description: The format for the resulting image's mediaType. Valid values are oci or docker.
  - name: enable-cache-proxy
    default: 'false'
    description: Enable cache proxy configuration
    type: string
  - name: e2e-credentials-secret
    description: Name of the secret containing e2e test credentials
    type: string
    default: ""
  - name: e2e-hcc-env
    description: HCC environment (e.g., stage, prod)
    type: string
    default: "stage"
  - name: e2e-hcc-env-url
    description: HCC environment URL
    type: string
    default: "https://console.stage.redhat.com"
  - name: e2e-base-url
    description: Optional Playwright base URL. When set, forwarded as PLAYWRIGHT_BASE_URL to the test runner. Leave empty to preserve existing consumer behavior.
    type: string
    default: ""
  - name: e2e-readiness-path
    description: Application readiness check path appended to the app URL (e.g. /api/v1/health). Empty checks the root page.
    type: string
    default: ""
  - name: e2e-readiness-timeout
    description: Maximum seconds to wait for application readiness before failing.
    type: string
    default: "120"
  - name: e2e-proxy-readiness-url
    description: >-
      Optional browser-facing URL for proxy readiness. When set, the E2E step
      waits for this URL to respond before running the consumer script and
      propagates timeout as a task failure. Use the actual hostname the proxy
      serves (e.g. https://stage.foo.redhat.com:1337/) so TLS SNI and Host
      match. Ensure the hostname resolves inside the pod via
      podTemplate.hostAliases. When empty (default), the proxy readiness check
      is skipped to preserve existing consumer behavior.
    type: string
    default: ""
  - name: enable-package-registry-proxy
    default: 'true'
    description: Use the package registry proxy when prefetching dependencies
    type: string
  - name: sast-target-dirs
    type: string
    default: .
    description: Target directories to scan with SAST tools. Multiple values should be separated with commas.
  - name: source-date-epoch
    type: string
    default: ''
    description: Sets the image created time and the SOURCE_DATE_EPOCH build argument. On its own, it does not change file timestamps inside the layers (set rewrite-timestamp to "true" for that). Leave empty to keep the actual build time.
  - name: rewrite-timestamp
    type: string
    default: 'false'
    description: When "true", clamp file modification times in the image layers to at most source-date-epoch. Does nothing unless source-date-epoch is set.
  - name: omit-history
    type: string
    default: 'false'
    description: When "true", omit the build history (history timestamps, layer metadata, etc.) from the resulting image.
  results:
  - description: ""
    name: IMAGE_URL
    value: $(tasks.build-image-index.results.IMAGE_URL)
  - description: ""
    name: IMAGE_DIGEST
    value: $(tasks.build-image-index.results.IMAGE_DIGEST)
  - description: ""
    name: CHAINS-GIT_URL
    value: $(tasks.clone-repository.results.url)
  - description: ""
    name: CHAINS-GIT_COMMIT
    value: $(tasks.clone-repository.results.commit)
  tasks:
  - name: init
    params:
    - name: image-url
      value: $(params.output-image)
    - name: rebuild
      value: $(params.rebuild)
    - name: skip-checks
      value: $(params.skip-checks)
    - name: enable-cache-proxy
      value: $(params.enable-cache-proxy)
    taskRef:
      params:
      - name: name
        value: init
      - name: bundle
        value: quay.io/konflux-ci/tekton-catalog/task-init:0.4.3@sha256:ba9c197132e5a1e80116485f3f38ef47aba1efb1aee9417a9e859a55c33bb9df
      - name: kind
        value: task
      resolver: bundles
  - name: clone-repository
    params:
    - name: url
      value: $(params.git-url)
    - name: revision
      value: $(params.revision)
    runAfter:
    - init
    taskRef:
      params:
      - name: name
        value: git-clone
      - name: bundle
        value: quay.io/konflux-ci/tekton-catalog/task-git-clone:0.2.6@sha256:2f39fc8d18568ecb07d29755c453718f50868b5b2673198b5ed60f1300890dab
      - name: kind
        value: task
      resolver: bundles
    workspaces:
    - name: output
      workspace: workspace
    - name: basic-auth
      workspace: git-auth
  - name: prefetch-dependencies
    params:
    - name: input
      value: $(params.prefetch-input)
    - name: enable-package-registry-proxy
      value: $(params.enable-package-registry-proxy)
    runAfter:
    - clone-repository
    taskRef:
      params:
      - name: name
        value: prefetch-dependencies
      - name: bundle
        value: quay.io/konflux-ci/tekton-catalog/task-prefetch-dependencies:0.11.0@sha256:662bd51beb9d6f209e5b18d4047c4cabf5cdc0148fc9a110a3d8eb70416a4096
      - name: kind
        value: task
      resolver: bundles
    when:
    - input: $(params.prefetch-input)
      operator: notin
      values:
      - ""
    workspaces:
    - name: source
      workspace: workspace
    - name: git-basic-auth
      workspace: git-auth
    - name: netrc
      workspace: netrc
  - name: build-container
    params:
    - name: IMAGE
      value: $(params.output-image)
    - name: DOCKERFILE
      value: $(params.dockerfile)
    - name: CONTEXT
      value: $(params.path-context)
    - name: HERMETIC
      value: $(params.hermetic)
    - name: PREFETCH_INPUT
      value: $(params.prefetch-input)
    - name: IMAGE_EXPIRES_AFTER
      value: $(params.image-expires-after)
    - name: COMMIT_SHA
      value: $(tasks.clone-repository.results.commit)
    - name: BUILD_ARGS
      value:
      - $(params.build-args[*])
    - name: LABELS
      value:
      - $(params.labels[*])
    - name: ANNOTATIONS
      value:
      - $(params.annotations[*])
    - name: TARGET_STAGE
      value: $(params.target-stage)
    - name: BUILDAH_FORMAT
      value: $(params.buildah-format)
    - name: HTTP_PROXY
      value: $(tasks.init.results.http-proxy)
    - name: NO_PROXY
      value: $(tasks.init.results.no-proxy)
    - name: SOURCE_DATE_EPOCH
      value: $(params.source-date-epoch)
    - name: REWRITE_TIMESTAMP
      value: $(params.rewrite-timestamp)
    - name: OMIT_HISTORY
      value: $(params.omit-history)
    - name: BUILD_ARGS_FILES
      value:
      - $(params.build-args-file)
    runAfter:
    - prefetch-dependencies
    taskRef:
      params:
      - name: name
        value: buildah
      - name: bundle
        value: quay.io/konflux-ci/tekton-catalog/task-buildah:0.14.0@sha256:d930e9ca5be323178d2aeb6857138285b3554acc8e0d0c033fdefda8affad83b
      - name: kind
        value: task
      resolver: bundles
    workspaces:
    - name: source
      workspace: workspace
  - name: build-image-index
    params:
    - name: IMAGE
      value: $(params.output-image)
    - name: ALWAYS_BUILD_INDEX
      value: $(params.build-image-index)
    - name: IMAGES
      value:
      - $(tasks.build-container.results.IMAGE_URL)@$(tasks.build-container.results.IMAGE_DIGEST)
    - name: BUILDAH_FORMAT
      value: $(params.buildah-format)
    runAfter:
    - build-container
    taskRef:
      params:
      - name: name
        value: build-image-index
      - name: bundle
        value: quay.io/konflux-ci/tekton-catalog/task-build-image-index:0.4@sha256:0c0cf90a91b0962a10400e3a8bdc60ab6369642e3563ad25598caca3d0304686
      - name: kind
        value: task
      resolver: bundles
  - name: build-source-image
    params:
    - name: BINARY_IMAGE
      value: $(tasks.build-image-index.results.IMAGE_URL)
    - name: BINARY_IMAGE_DIGEST
      value: $(tasks.build-image-index.results.IMAGE_DIGEST)
    runAfter:
    - build-image-index
    taskRef:
      params:
      - name: name
        value: source-build
      - name: bundle
        value: quay.io/konflux-ci/tekton-catalog/task-source-build:0.4.0@sha256:4826b7e152dd380da42574b4b3fc8f7c7fe9ee289fba702e3b411f963c8cc6d7
      - name: kind
        value: task
      resolver: bundles
    when:
    - input: $(params.build-source-image)
      operator: in
      values:
      - "true"
    workspaces:
    - name: workspace
      workspace: workspace
  - name: deprecated-base-image-check
    params:
    - name: IMAGE_URL
      value: $(tasks.build-image-index.results.IMAGE_URL)
    - name: IMAGE_DIGEST
      value: $(tasks.build-image-index.results.IMAGE_DIGEST)
    runAfter:
    - build-image-index
    taskRef:
      params:
      - name: name
        value: deprecated-image-check
      - name: bundle
        value: quay.io/konflux-ci/tekton-catalog/task-deprecated-image-check:0.5@sha256:81b7cad8d5fd0148b157d622f4064f57d38aa33c142275050c8a4727d1e2144c
      - name: kind
        value: task
      resolver: bundles
    when:
    - input: $(params.skip-checks)
      operator: in
      values:
      - "false"
  - name: roxctl-scan
    params:
    - name: image-digest
      value: $(tasks.build-image-index.results.IMAGE_DIGEST)
    - name: image-url
      value: $(tasks.build-image-index.results.IMAGE_URL)
    runAfter:
    - build-image-index
    taskRef:
      params:
      - name: name
        value: roxctl-scan
      - name: bundle
        value: quay.io/konflux-ci/tekton-catalog/task-roxctl-scan:0.1.1@sha256:4d2c2edcfa0e3616ceb3fe67534aa1955f73fc14209acf734f2d9c9f1f47de27
      - name: kind
        value: task
      resolver: bundles
    when:
    - input: $(params.skip-checks)
      operator: in
      values:
      - "false"
  - name: ecosystem-cert-preflight-checks
    params:
    - name: image-url
      value: $(tasks.build-image-index.results.IMAGE_URL)
    runAfter:
    - build-image-index
    taskRef:
      params:
      - name: name
        value: ecosystem-cert-preflight-checks
      - name: bundle
        value: quay.io/konflux-ci/tekton-catalog/task-ecosystem-cert-preflight-checks:0.2@sha256:cc7d71d9be01e9221d8753a1f1a7caaf0fb93048df69e9a95c359068dc730578
      - name: kind
        value: task
      resolver: bundles
    when:
    - input: $(params.skip-checks)
      operator: in
      values:
      - "false"
  - name: sast-snyk-check
    params:
    - name: image-digest
      value: $(tasks.build-image-index.results.IMAGE_DIGEST)
    - name: image-url
      value: $(tasks.build-image-index.results.IMAGE_URL)
    - name: TARGET_DIRS
      value: $(params.sast-target-dirs)
    runAfter:
    - build-image-index
    taskRef:
      params:
      - name: name
        value: sast-snyk-check
      - name: bundle
        value: quay.io/konflux-ci/tekton-catalog/task-sast-snyk-check:0.5.1@sha256:39471f734490cc9ece54b7ade88e163bec9eb751536c01ad1d6251a1e02c1663
      - name: kind
        value: task
      resolver: bundles
    when:
    - input: $(params.skip-checks)
      operator: in
      values:
      - "false"
    workspaces:
    - name: workspace
      workspace: workspace
  - name: clamav-scan
    params:
    - name: image-digest
      value: $(tasks.build-image-index.results.IMAGE_DIGEST)
    - name: image-url
      value: $(tasks.build-image-index.results.IMAGE_URL)
    runAfter:
    - build-image-index
    taskRef:
      params:
      - name: name
        value: clamav-scan
      - name: bundle
        value: quay.io/konflux-ci/tekton-catalog/task-clamav-scan:0.3.4@sha256:6406168c03f83558b4ff454fec2503269ee8f522ea2cd2d1b293cc75d37df32a
      - name: kind
        value: task
      resolver: bundles
    when:
    - input: $(params.skip-checks)
      operator: in
      values:
      - "false"
  - name: sast-coverity-check
    params:
    - name: image-digest
      value: $(tasks.build-container.results.IMAGE_DIGEST)
    - name: image-url
      value: $(tasks.build-container.results.IMAGE_URL)
    - name: IMAGE
      value: $(params.output-image)
    - name: DOCKERFILE
      value: $(params.dockerfile)
    - name: CONTEXT
      value: $(params.path-context)
    - name: HERMETIC
      value: $(params.hermetic)
    - name: PREFETCH_INPUT
      value: $(params.prefetch-input)
    - name: IMAGE_EXPIRES_AFTER
      value: $(params.image-expires-after)
    - name: COMMIT_SHA
      value: $(tasks.clone-repository.results.commit)
    - name: BUILD_ARGS
      value:
      - $(params.build-args[*])
    - name: BUILD_ARGS_FILE
      value: $(params.build-args-file)
    - name: TARGET_STAGE
      value: $(params.target-stage)
    - name: TARGET_DIRS
      value: $(params.sast-target-dirs)
    runAfter:
    - coverity-availability-check
    taskRef:
      params:
      - name: name
        value: sast-coverity-check
      - name: bundle
        value: quay.io/konflux-ci/tekton-catalog/task-sast-coverity-check:0.3@sha256:f44de9d91535f0213d747bbbf75ee7f2e69a607a8c9a5ea7ef26bf738e66995a
      - name: kind
        value: task
      resolver: bundles
    when:
    - input: $(params.skip-checks)
      operator: in
      values:
      - "false"
    - input: $(tasks.coverity-availability-check.results.STATUS)
      operator: in
      values:
      - success
    workspaces:
    - name: source
      workspace: workspace
  - name: coverity-availability-check
    runAfter:
    - build-image-index
    taskRef:
      params:
      - name: name
        value: coverity-availability-check
      - name: bundle
        value: quay.io/konflux-ci/tekton-catalog/task-coverity-availability-check:0.2@sha256:8b501440a960aec446db2ebc6625a49d0317a9fc7bf0f7bd9b18cb63052db7de
      - name: kind
        value: task
      resolver: bundles
    when:
    - input: $(params.skip-checks)
      operator: in
      values:
      - "false"
  - name: sast-shell-check
    params:
    - name: image-digest
      value: $(tasks.build-image-index.results.IMAGE_DIGEST)
    - name: image-url
      value: $(tasks.build-image-index.results.IMAGE_URL)
    - name: TARGET_DIRS
      value: $(params.sast-target-dirs)
    runAfter:
    - build-image-index
    taskRef:
      params:
      - name: name
        value: sast-shell-check
      - name: bundle
        value: quay.io/konflux-ci/tekton-catalog/task-sast-shell-check:0.1.1@sha256:07bd3581ee1afb07ef39a7a106bb1080fe06921c88e6fb90a9e0fa39dcb61da9
      - name: kind
        value: task
      resolver: bundles
    when:
    - input: $(params.skip-checks)
      operator: in
      values:
      - "false"
    workspaces:
    - name: workspace
      workspace: workspace
  - name: sast-unicode-check
    params:
    - name: image-digest
      value: $(tasks.build-image-index.results.IMAGE_DIGEST)
    - name: image-url
      value: $(tasks.build-image-index.results.IMAGE_URL)
    - name: TARGET_DIRS
      value: $(params.sast-target-dirs)
    runAfter:
    - build-image-index
    taskRef:
      params:
      - name: name
        value: sast-unicode-check
      - name: bundle
        value: quay.io/konflux-ci/tekton-catalog/task-sast-unicode-check:0.4.1@sha256:c7d2e6b15f8178d3d3d4d09856035ce2e5edff430a470322593bac324c3c5d35
      - name: kind
        value: task
      resolver: bundles
    when:
    - input: $(params.skip-checks)
      operator: in
      values:
      - "false"
    workspaces:
    - name: workspace
      workspace: workspace
  - name: apply-tags
    params:
    - name: IMAGE_URL
      value: $(tasks.build-image-index.results.IMAGE_URL)
    - name: IMAGE_DIGEST
      value: $(tasks.build-image-index.results.IMAGE_DIGEST)
    runAfter:
    - build-image-index
    taskRef:
      params:
      - name: name
        value: apply-tags
      - name: bundle
        value: quay.io/konflux-ci/tekton-catalog/task-apply-tags:0.3.2@sha256:87e14517c2d35f245e31bd0c055954bd97beeb4d09c38bf82a91a1bed4ab826c
      - name: kind
        value: task
      resolver: bundles
  - name: push-dockerfile
    params:
    - name: IMAGE
      value: $(tasks.build-image-index.results.IMAGE_URL)
    - name: IMAGE_DIGEST
      value: $(tasks.build-image-index.results.IMAGE_DIGEST)
    - name: DOCKERFILE
      value: $(params.dockerfile)
    - name: CONTEXT
      value: $(params.path-context)
    runAfter:
    - build-image-index
    taskRef:
      params:
      - name: name
        value: push-dockerfile
      - name: bundle
        value: quay.io/konflux-ci/tekton-catalog/task-push-dockerfile:0.3.1@sha256:8aa76b71f3f9625ff0d2825d5af19dc6c49d809c010474b363303cfb77f927af
      - name: kind
        value: task
      resolver: bundles
    workspaces:
    - name: workspace
      workspace: workspace
  - name: rpms-signature-scan
    params:
    - name: image-url
      value: $(tasks.build-image-index.results.IMAGE_URL)
    - name: image-digest
      value: $(tasks.build-image-index.results.IMAGE_DIGEST)
    runAfter:
    - build-image-index
    taskRef:
      params:
      - name: name
        value: rpms-signature-scan
      - name: bundle
        value: quay.io/konflux-ci/tekton-catalog/task-rpms-signature-scan:0.2.2@sha256:3e9b994f069cd7179b07f3bacb569c13bb065a23326f41a0ec574ce66461ecbf
      - name: kind
        value: task
      resolver: bundles
    when:
    - input: $(params.skip-checks)
      operator: in
      values:
      - "false"
    # Custom task (not generated by Konflux)
  - name: clone-repository-oci-ta
    params:
    - name: url
      value: $(params.git-url)
    - name: revision
      value: $(params.revision)
    - name: ociStorage
      value: $(params.output-image).git
    runAfter:
    - init
    taskRef:
      params:
      - name: name
        value: git-clone-oci-ta
      - name: bundle
        value: quay.io/konflux-ci/tekton-catalog/task-git-clone-oci-ta:0.2.6@sha256:b3c05f2aab54b5b6d7e9b5a95931b2c6602574604842a4c430fdb3fbc3fb9fcb
      - name: kind
        value: task
      resolver: bundles
    workspaces:
    - name: basic-auth
      workspace: git-auth
    # Custom task (not generated by Konflux)
  - name: run-unit-tests
    description: Validates frontend unit tests
    params:
    - name: SOURCE_ARTIFACT
      value: $(tasks.clone-repository-oci-ta.results.SOURCE_ARTIFACT)
    - name: WORKSPACE_SETUP_SCRIPT
      value: $(params.workspace-setup-script)
    - name: UNIT_TESTS_SCRIPT
      value: $(params.unit-tests-script)
    - name: UNIT_TEST_IMAGE
      value: $(params.unit-test-image)
    runAfter:
    - clone-repository-oci-ta
    workspaces:
    - name: basic-auth
      workspace: git-auth
    - name: shared-workspace
      workspace: workspace
    taskSpec:
      params:
      - description: The Trusted Artifact URI pointing to the artifact with the application source code.
        name: SOURCE_ARTIFACT
        type: string
      - description: Script to run before unit tests (e.g., npm install)
        name: WORKSPACE_SETUP_SCRIPT
        type: string
      - description: Script to run unit tests
        name: UNIT_TESTS_SCRIPT
        type: string
      - description: Image to use for running unit tests
        name: UNIT_TEST_IMAGE
        type: string
      workspaces:
      - name: shared-workspace
        mountPath: /var/workdir
      steps:
      - name: workspace-permission-diagnostics
        image: quay.io/redhat-appstudio/build-trusted-artifacts:latest@sha256:9b180776a41d9a22a1c51539f1647c60defbbd55b44bbebdd4130e33512d8b0d
        env:
        - name: HOME
          value: /var/workdir
        securityContext:
          runAsUser: 1000
          runAsGroup: 1000
          runAsNonRoot: true
          allowPrivilegeEscalation: false
        command: ["/bin/sh", "-c"]
        args:
        - |
          echo "=== Workspace Permission Diagnostics ==="
          echo "--- id ---"
          id
          echo "--- /var/workdir ownership and mode ---"
          ls -la /var/ | grep workdir
          ls -la /var/workdir/ 2>/dev/null || echo "(empty or inaccessible)"
          echo "--- stat /var/workdir ---"
          stat /var/workdir
          echo "--- .git check ---"
          if [ -e /var/workdir/.git ]; then
            ls -la /var/workdir/.git
            stat /var/workdir/.git
          else
            echo "no .git present"
          fi
          echo "--- write test ---"
          if test -w /var/workdir; then
            echo "/var/workdir IS writable"
          else
            echo "/var/workdir is NOT writable"
          fi
          echo "=== End Diagnostics ==="
      - name: use-trusted-artifact
        image: quay.io/redhat-appstudio/build-trusted-artifacts:latest@sha256:9b180776a41d9a22a1c51539f1647c60defbbd55b44bbebdd4130e33512d8b0d
        env:
        - name: HOME
          value: /var/workdir
        # Skip only the archive root entry: fsGroup grants write access, not
        # ownership needed to restore the volume root's mode and timestamps.
        # --no-recursion keeps the exclusion from also excluding its contents.
        - name: TAR_OPTIONS
          value: "--no-recursion --anchored --exclude=."
        # Extract source as the same identity that installs dependencies and runs tests.
        # The PipelineRun must provide a workspace writable by this identity.
        securityContext:
          runAsUser: 1000
          runAsGroup: 1000
          runAsNonRoot: true
          allowPrivilegeEscalation: false
        args:
        - use
        - $(params.SOURCE_ARTIFACT)=/var/workdir
      - image: $(params.UNIT_TEST_IMAGE)
        workingDir: /var/workdir
        name: workspace-setup
        env:
        - name: HOME
          value: /var/workdir
        securityContext:
          runAsUser: 1000
          runAsGroup: 1000
          runAsNonRoot: true
          allowPrivilegeEscalation: false
        script: |
          #!/bin/bash
          if [ -n "$(params.WORKSPACE_SETUP_SCRIPT)" ]; then
            bash -c "$(params.WORKSPACE_SETUP_SCRIPT)"
          else
            echo "No workspace setup script provided, skipping..."
          fi
      - image: $(params.UNIT_TEST_IMAGE)
        workingDir: /var/workdir
        name: unit-tests
        env:
        # Keep user-level caches writable regardless of the image's default HOME.
        - name: HOME
          value: /var/workdir
        securityContext:
          runAsUser: 1000
          runAsGroup: 1000
          runAsNonRoot: true
          allowPrivilegeEscalation: false
        script: $(params.UNIT_TESTS_SCRIPT)
    # Custom task (not generated by Konflux)
  - name: run-e2e-tests
    description: Runs e2e tests against the built application
    params:
      - name: SOURCE_ARTIFACT
        value: $(tasks.clone-repository-oci-ta.results.SOURCE_ARTIFACT)
      - name: APPLICATION_IMAGE
        value: $(tasks.build-image-index.results.IMAGE_URL)@$(tasks.build-image-index.results.IMAGE_DIGEST)
      - name: IMAGE_DIGEST
        value: $(tasks.build-image-index.results.IMAGE_DIGEST)
      - name: e2e-tests-script
        value: $(params.e2e-tests-script)
      - name: APP_COMMAND
        value: $(params.run-app-command)
      - name: APP_ARGS
        value: $(params.run-app-args[*])
      - name: PROXY_ROUTES_CONFIGMAP
        value: $(params.frontend-proxy-routes-configmap)
      - name: APP_PORT
        value: $(params.e2e-app-port)
      - name: PLAYWRIGHT_IMAGE
        value: $(params.e2e-playwright-image)
      - name: PROXY_IMAGE
        value: $(params.e2e-proxy-image)
      - name: CREDENTIALS_SECRET
        value: $(params.e2e-credentials-secret)
      - name: HCC_ENV
        value: $(params.e2e-hcc-env)
      - name: HCC_ENV_URL
        value: $(params.e2e-hcc-env-url)
      - name: BASE_URL
        value: $(params.e2e-base-url)
      - name: READINESS_PATH
        value: $(params.e2e-readiness-path)
      - name: READINESS_TIMEOUT
        value: $(params.e2e-readiness-timeout)
      - name: PROXY_READINESS_URL
        value: $(params.e2e-proxy-readiness-url)
      - name: E2E_OCI_STORAGE
        value: $(params.output-image).e2e-results
    runAfter:
    - clone-repository-oci-ta
    - build-image-index
    - run-unit-tests
    workspaces:
    - name: basic-auth
      workspace: git-auth
    - name: shared-workspace
      workspace: workspace
    taskSpec:
      params:
        - description: The Trusted Artifact URI pointing to the test source code
          name: SOURCE_ARTIFACT
          type: string
        - description: The built application image to test (URL@digest for immutable reference)
          name: APPLICATION_IMAGE
          type: string
        - description: Image digest of the built application image
          name: IMAGE_DIGEST
          type: string
        - description: The script to execute the e2e tests
          name: e2e-tests-script
          type: string
        - description: Executable to run in the application sidecar
          name: APP_COMMAND
          type: string
        - default: []
          description: Arguments passed to APP_COMMAND
          name: APP_ARGS
          type: array
        - description: Name of ConfigMap containing proxy routes data
          name: PROXY_ROUTES_CONFIGMAP
          type: string
        - description: Application port (default 8000)
          name: APP_PORT
          type: string
        - description: Playwright image to use for testing
          name: PLAYWRIGHT_IMAGE
          type: string
        - description: Frontend proxy image
          name: PROXY_IMAGE
          type: string
        - description: Name of the secret containing e2e credentials
          name: CREDENTIALS_SECRET
          type: string
        - description: HCC environment (e.g., stage, prod)
          name: HCC_ENV
          type: string
        - description: HCC environment URL
          name: HCC_ENV_URL
          type: string
        - description: Optional Playwright base URL
          name: BASE_URL
          type: string
        - description: Application readiness check path
          name: READINESS_PATH
          type: string
        - description: Maximum seconds to wait for application readiness
          name: READINESS_TIMEOUT
          type: string
        - description: Optional browser-facing URL to probe for proxy readiness
          name: PROXY_READINESS_URL
          type: string
        - description: OCI base URI for storing e2e test artifacts
          name: E2E_OCI_STORAGE
          type: string
      results:
      - name: E2E_ARTIFACTS_URI
        description: OCI URI of uploaded e2e test artifacts (empty if no artifacts found)
      workspaces:
      - name: shared-workspace
        mountPath: /var/workdir
      volumes:
      - name: proxy-config
        emptyDir: {}
      - name: test-status
        emptyDir: {}
      - name: proxy-routes-configmap
        configMap:
          name: $(params.PROXY_ROUTES_CONFIGMAP)
          optional: true
          items:
          - key: routes
            path: routes
      sidecars:
      - image: $(params.PROXY_IMAGE)
        name: frontend-dev-proxy
        command: ["/bin/sh", "-c"]
        args:
        - |
          #!/bin/sh

          # Guard against Tekton nop image replacement
          # See: https://github.com/tektoncd/pipeline/issues/1347
          if ! command -v caddy >/dev/null 2>&1; then
            echo "Caddy not found - running in nop image, exiting gracefully"
            exit 0
          fi

          echo "Waiting for /config/routes to be available..."
          timeout=60
          max_wait="${READINESS_TIMEOUT:-120}"
          elapsed=0
          while [ ! -f /config/routes ] && [ $elapsed -lt $timeout ]; do
            echo "Config file not found, waiting... ($elapsed/$timeout seconds)"
            sleep 2
            elapsed=$((elapsed + 2))
          done

          if [ ! -f /config/routes ]; then
            echo "ERROR: /config/routes not found after ${timeout} seconds"
            exit 1
          fi

          echo "Config file found!"
          echo "Routes content:"
          cat /config/routes

          # Export LOCAL_ROUTES environment variable from the file
          export LOCAL_ROUTES="$(cat /config/routes)"
          echo "LOCAL_ROUTES environment variable set"

          # Validate HCC_ENV_URL is set
          if [ -z "${HCC_ENV_URL}" ]; then
            echo "ERROR: HCC_ENV_URL environment variable is not set!"
            echo "This is required for proxying and other upstream routes."
            exit 1
          fi

          # Wait for run-application to be ready on the configured port
          readiness_url="http://127.0.0.1:${APP_PORT}${READINESS_PATH}"
          echo "Waiting for run-application to be ready at ${readiness_url}..."
          elapsed=0
          while [ $elapsed -lt $max_wait ]; do
            if wget -q -O /dev/null --timeout=2 "${readiness_url}" 2>/dev/null; then
              echo "run-application is ready!"
              break
            fi
            echo "Waiting for run-application... ($elapsed/$max_wait seconds)"
            sleep 2
            elapsed=$((elapsed + 2))
          done

          if [ $elapsed -ge $max_wait ]; then
            echo "ERROR: run-application did not become ready at ${readiness_url} after ${max_wait} seconds"
            exit 1
          fi

          echo "Starting frontend-development-proxy using container's template Caddyfile..."
          caddy run --config /etc/caddy/Caddyfile
        envFrom:
        - secretRef:
            name: $(params.CREDENTIALS_SECRET)
            optional: false
        env:
        - name: NO_PROXY
          value: "127.0.0.1,localhost"
        - name: APP_PORT
          value: $(params.APP_PORT)
        - name: READINESS_PATH
          value: $(params.READINESS_PATH)
        - name: READINESS_TIMEOUT
          value: $(params.READINESS_TIMEOUT)
        - name: HCC_ENV
          value: $(params.HCC_ENV)
        - name: PROXY_PORT
          value: "1337"
        # Backwards compatibility: explicit mappings for env vars that don't match envFrom conversion
        - name: E2E_USER
          valueFrom:
            secretKeyRef:
              name: $(params.CREDENTIALS_SECRET)
              key: e2e-user
              optional: true
        - name: E2E_PASSWORD
          valueFrom:
            secretKeyRef:
              name: $(params.CREDENTIALS_SECRET)
              key: e2e-password
              optional: true
        - name: HCC_ENV_URL
          value: $(params.HCC_ENV_URL)
        - name: APP_PORT
          value: $(params.APP_PORT)
        - name: STAGE_ACTUAL_HOSTNAME
          valueFrom:
            secretKeyRef:
              name: $(params.CREDENTIALS_SECRET)
              key: e2e-stage-actual-hostname
              optional: true
        securityContext:
          privileged: false
        volumeMounts:
        - name: proxy-config
          mountPath: /config
      - name: run-application
        image: $(params.APPLICATION_IMAGE)
        command: ["$(params.APP_COMMAND)"]
        args: ["$(params.APP_ARGS[*])"]
        env:
        - name: GODEBUG
          value: ""
        - name: HCC_ENV_URL
          value: $(params.HCC_ENV_URL)
        securityContext:
          privileged: false
      steps:
        - name: setup-proxy-routes
          image: quay.io/quay/busybox
          env:
          - name: HOME
            value: /tmp
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            runAsNonRoot: true
            allowPrivilegeEscalation: false
          script: |
            #!/bin/sh
            set -e

            # Check if ConfigMap data is available
            if [ ! -f /configmap-data/routes ]; then
              echo "ERROR: ConfigMap routes file not found at /configmap-data/routes"
              echo "Please ensure the ConfigMap is properly configured with a 'routes' key"
              exit 1
            fi

            if [ ! -s /configmap-data/routes ]; then
              echo "ERROR: ConfigMap routes file is empty"
              exit 1
            fi

            echo "Using routes from ConfigMap..."
            cp /configmap-data/routes /config/routes
            chmod 644 /config/routes
            echo "Routes content:"
            cat /config/routes
          volumeMounts:
            - name: proxy-config
              mountPath: /config
            - name: proxy-routes-configmap
              mountPath: /configmap-data
        - image: $(params.PLAYWRIGHT_IMAGE)
          envFrom:
            - secretRef:
                name: $(params.CREDENTIALS_SECRET)
                optional: false
          env:
            - name: NO_PROXY
              value: "stage.foo.redhat.com,prod.foo.redhat.com"
            # Backwards compatibility: explicit mappings for env vars that don't match envFrom conversion
            - name: E2E_USER
              valueFrom:
                secretKeyRef:
                  name: $(params.CREDENTIALS_SECRET)
                  key: e2e-user
                  optional: true
            - name: E2E_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: $(params.CREDENTIALS_SECRET)
                  key: e2e-password
                  optional: true
            - name: HCC_ENV_URL
              value: $(params.HCC_ENV_URL)
            - name: STAGE_ACTUAL_HOSTNAME
              valueFrom:
                secretKeyRef:
                  name: $(params.CREDENTIALS_SECRET)
                  key: e2e-stage-actual-hostname
                  optional: true
            - name: APPLICATION_IMAGE
              value: $(params.APPLICATION_IMAGE)
            - name: IMAGE_DIGEST
              value: $(params.IMAGE_DIGEST)
            - name: _E2E_BASE_URL
              value: $(params.BASE_URL)
            - name: READINESS_TIMEOUT
              value: $(params.READINESS_TIMEOUT)
            - name: _PROXY_READINESS_URL
              value: $(params.PROXY_READINESS_URL)
          name: e2e-tests
          workingDir: /var/workdir
          computeResources:
            requests:
              cpu: "2000m"
              memory: "4Gi"
            limits:
              cpu: "4000m"
              memory: "8Gi"
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            runAsNonRoot: true
            allowPrivilegeEscalation: false
          volumeMounts:
          - name: test-status
            mountPath: /var/test-status
          script: |
            #!/bin/bash
            # Record the tested image reference for diagnostics
            echo "=== E2E Test Diagnostics ==="
            echo "APPLICATION_IMAGE=${APPLICATION_IMAGE}"
            echo "IMAGE_DIGEST=${IMAGE_DIGEST}"
            echo "PLAYWRIGHT_BASE_URL=${PLAYWRIGHT_BASE_URL:-<not set>}"
            echo "==========================="

            # Only export PLAYWRIGHT_BASE_URL when explicitly set via e2e-base-url.
            # An empty Kubernetes env entry overrides envFrom/image-supplied values,
            # so an existing consumer's PLAYWRIGHT_BASE_URL would be silently cleared.
            if [ -n "${_E2E_BASE_URL}" ]; then
              export PLAYWRIGHT_BASE_URL="${_E2E_BASE_URL}"
            fi

            # --- Proxy readiness check (optional) ---
            # When e2e-proxy-readiness-url is set, wait for the proxy to respond
            # on the browser-facing URL before running tests. The consumer must
            # supply the actual hostname the proxy serves (e.g.
            # https://stage.foo.redhat.com:1337/) and ensure it resolves inside
            # the pod via podTemplate.hostAliases → 127.0.0.1.
            # When omitted, this check is skipped entirely.
            if [ -n "${_PROXY_READINESS_URL}" ]; then
              PROXY_TIMEOUT="${READINESS_TIMEOUT:-120}"
              echo "Waiting for proxy readiness at ${_PROXY_READINESS_URL} (timeout ${PROXY_TIMEOUT}s)..."
              elapsed=0
              proxy_ready=false
              while [ $elapsed -lt $PROXY_TIMEOUT ]; do
                if wget -q -O /dev/null --no-check-certificate \
                     --timeout=2 "${_PROXY_READINESS_URL}" 2>/dev/null; then
                  echo "Proxy is ready!"
                  proxy_ready=true
                  break
                fi
                echo "Waiting for proxy... ($elapsed/${PROXY_TIMEOUT}s)"
                sleep 2
                elapsed=$((elapsed + 2))
              done

              if [ "${proxy_ready}" != "true" ]; then
                echo "ERROR: proxy not ready at ${_PROXY_READINESS_URL} after ${PROXY_TIMEOUT}s"
                echo "Check that the hostname resolves inside the pod (podTemplate.hostAliases)"
                echo "and that the proxy sidecar started successfully."
                echo -n "1" > /var/test-status/exit-code
                echo "=== Post-Test Diagnostics ==="
                echo "Test exit code: 1 (proxy readiness timeout)"
                echo "==========================="
                exit 0
              fi
            fi

            # Write consumer script to a temp file for subprocess execution.
            # A separate shell process isolates set -e and explicit exit from
            # the wrapper — both would otherwise skip diagnostic collection.
            cat > /tmp/_e2e_consumer.sh << '_E2E_SCRIPT_BOUNDARY'
            $(params.e2e-tests-script)
            _E2E_SCRIPT_BOUNDARY
            chmod +x /tmp/_e2e_consumer.sh

            set +e
            /bin/bash /tmp/_e2e_consumer.sh
            TEST_EXIT_CODE=$?
            set -e

            # Save exit code IMMEDIATELY — before any artifact preparation
            # that could fail and prevent recording it.
            echo -n "${TEST_EXIT_CODE}" > /var/test-status/exit-code

            # Collect diagnostics regardless of test outcome
            echo "=== Post-Test Diagnostics ==="
            echo "Test exit code: ${TEST_EXIT_CODE}"
            if [ -d "test-results" ]; then
              size=`du -sh test-results 2>/dev/null | cut -f1`
              echo "Test results directory found (${size})"
            fi
            if [ -d "playwright-report" ]; then
              size=`du -sh playwright-report 2>/dev/null | cut -f1`
              echo "Playwright report directory found (${size})"
            fi
            echo "==========================="

            # Prepare test artifacts for OCI upload (best-effort).
            # Failures here must not prevent exit-code propagation.
            set +e
            ARTIFACTS_DIR="/var/workdir/.e2e-artifacts"
            mkdir -p "${ARTIFACTS_DIR}"
            if [ $? -ne 0 ]; then
              echo "WARNING: failed to create artifacts directory — skipping artifact collection"
              exit 0
            fi

            echo "{\"test_exit_code\":${TEST_EXIT_CODE},\"timestamp\":\"`date -u +%Y-%m-%dT%H:%M:%SZ`\"}" \
              > "${ARTIFACTS_DIR}/metadata.json"

            for dir in playwright-report test-results; do
              if [ -d "${dir}" ]; then
                cp -r "${dir}" "${ARTIFACTS_DIR}/" || \
                  echo "WARNING: failed to copy ${dir} — continuing"
              fi
            done

            # Remove credentials and authentication-state files
            find "${ARTIFACTS_DIR}" \( \
              -name 'storageState*' -o \
              -path '*/.auth/*' -o \
              -name 'credentials*' -o \
              -name 'auth.json' -o \
              -name '*.credentials' \
            \) -exec rm -rf {} + 2>/dev/null || true

            artifact_count=`find "${ARTIFACTS_DIR}" -type f | wc -l`
            echo "Prepared ${artifact_count} artifact files for upload"
            set -e

            # Exit 0 so post-test steps (artifact upload) can run.
            # The original test exit code is propagated by the final step.
            exit 0
        - name: upload-e2e-artifacts
          image: quay.io/redhat-appstudio/build-trusted-artifacts:latest@sha256:9b180776a41d9a22a1c51539f1647c60defbbd55b44bbebdd4130e33512d8b0d
          onError: continue
          args:
          - create
          - --store
          - $(params.E2E_OCI_STORAGE)
          - $(results.E2E_ARTIFACTS_URI.path)=/var/workdir/.e2e-artifacts
        - name: propagate-exit-code
          image: quay.io/quay/busybox
          env:
          - name: HOME
            value: /tmp
          volumeMounts:
          - name: test-status
            mountPath: /var/test-status
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            runAsNonRoot: true
            allowPrivilegeEscalation: false
          script: |
            #!/bin/sh
            # The upload step uses onError: continue — if it failed, its
            # logs show the cause but this step still runs. Upload failure
            # is non-fatal and never masks the test outcome.
            CODE=`cat /var/test-status/exit-code 2>/dev/null || echo 1`
            echo "Propagating e2e test exit code: ${CODE}"
            exit ${CODE}
  workspaces:
  - name: workspace
  - name: git-auth
    optional: true
  - name: netrc
    optional: true
